name: Build and publish custom Windows binary

on:
  push:
    branches:
      - v2
    paths:
      - .github/workflows/build-custom-windows-release.yml

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build-x86_64-windows.yml
    with:
      full_version: 2.0.4-r2-keji-xiaobaizhi
      openssl_version: "4.0.0"
      curl_version: "8.20.0"
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: esurfingclient-2.0.4-r2-keji-xiaobaizhi-windows-x86_64
          path: dist

      - name: Extract executable
        run: unzip dist/esurfingclient-2.0.4-r2-keji-xiaobaizhi-windows-x86_64.zip -d dist/unpacked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Kairo-WU/ESurfingClient-CVersion
        run: |
          gh release create "v2.0.4-r2-keji-xiaobaizhi"             "dist/unpacked/ESurfingClient-2.0.4-r2-keji-xiaobaizhi-windows-x86_64.exe"             --target "${GITHUB_SHA}"             --title "ESurfingClient 2.0.4-r2 科技小白纸版"             --notes "启动横幅仅保留分隔线和“科技小白纸”。基于 v2 分支提交构建。"             --latest
