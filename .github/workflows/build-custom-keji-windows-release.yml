name: Build and publish v2.1.2-r8 custom Windows binary

on:
  push:
    branches:
      - custom/keji-xiaobaizhi-v2.1.2-r8
    paths:
      - .github/workflows/build-custom-keji-windows-release.yml

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build-desktop-x86_64-windows.yml
    with:
      full_version: 2.1.2-r8-keji-xiaobaizhi
      curl_version: "8.20.0"
      tail_wind_labs_version: "v4.3.0"
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: esurfingclient-2.1.2-r8-keji-xiaobaizhi-windows-x86_64
          path: dist

      - name: Extract executable
        run: unzip dist/esurfingclient-2.1.2-r8-keji-xiaobaizhi-windows-x86_64.zip -d dist/unpacked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Kairo-WU/ESurfingClient-CVersion
        run: |
          gh release create "v2.1.2-r8-keji-xiaobaizhi" \
            "dist/esurfingclient-2.1.2-r8-keji-xiaobaizhi-windows-x86_64.zip" \
            "dist/unpacked/ESurfingClient-2.1.2-r8-keji-xiaobaizhi-windows-x86_64.exe" \
            --target "${GITHUB_SHA}" \
            --title "ESurfingClient 2.1.2-r8 科技小白纸版" \
            --notes "基于原作者 BadGhost520/ESurfingClient-CVersion 的 v2.1.2-r8 原始提交，仅将启动横幅正文替换为“科技小白纸”。" \
            --latest
