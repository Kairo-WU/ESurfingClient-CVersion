name: Build and publish URL-fixed Windows binary

on:
  push:
    branches:
      - v2
    paths:
      - .github/workflows/build-custom-windows-urlfix-release.yml

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build-x86_64-windows.yml
    with:
      full_version: 2.0.4-r2-keji-xiaobaizhi-urlfix1
      openssl_version: "4.0.0"
      curl_version: "8.20.0"
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: esurfingclient-2.0.4-r2-keji-xiaobaizhi-urlfix1-windows-x86_64
          path: dist

      - name: Extract executable
        run: unzip dist/esurfingclient-2.0.4-r2-keji-xiaobaizhi-urlfix1-windows-x86_64.zip -d dist/unpacked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Kairo-WU/ESurfingClient-CVersion
        run: |
          gh release create "v2.0.4-r2-keji-xiaobaizhi-urlfix1" \
            "dist/unpacked/ESurfingClient-2.0.4-r2-keji-xiaobaizhi-urlfix1-windows-x86_64.exe" \
            --target "${GITHUB_SHA}" \
            --title "ESurfingClient 2.0.4-r2 科技小白纸 URL修复版" \
            --notes "修复 Ticket URL 超过 255 字符时被截断、导致初始化会话失败的问题；启动横幅仍仅保留“科技小白纸”。" \
            --latest
